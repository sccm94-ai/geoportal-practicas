<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Geoportal Corregido</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v10.8.0/ol.css">
  
  <style>
    :root {
      --primary: #0f4c81;
      --primary-dark: #09304f;
      --accent: #1ea7fd;
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1d2733;
      --border: #d9e2ec;
      --success: #157347;
      --shadow: 0 10px 24px rgba(15, 76, 129, 0.12);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text);
    }

    header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #fff; padding: 20px; position: sticky; top: 0; z-index: 1000;
      box-shadow: var(--shadow);
    }

    .header-wrap { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }

    nav.tabs { display: flex; gap: 10px; }
    .tab-btn {
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3);
      color: #fff; padding: 10px 18px; border-radius: 25px; cursor: pointer; font-weight: 600;
    }
    .tab-btn.active { background: #fff; color: var(--primary); }

    main { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
    .panel { display: none; background: var(--card); padding: 25px; border-radius: 15px; box-shadow: var(--shadow); }
    .panel.active { display: block; }

    /* Estilos del Mapa */
    #map { width: 100%; height: 500px; border-radius: 12px; border: 1px solid var(--border); }
    
    .wms-container { 
      background: #eef2f7; border-radius: 12px; min-height: 450px; 
      display: flex; align-items: center; justify-content: center; overflow: hidden;
      border: 2px dashed var(--border);
    }
    .wms-container img { max-width: 100%; height: auto; }

    .btn-group { margin-bottom: 20px; display: flex; gap: 10px; }
    .btn {
      background: var(--primary); color: white; border: none;
      padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold;
    }
    .btn-success { background: var(--success); }
    
    .coords { margin-top: 10px; font-family: monospace; font-size: 0.9rem; color: var(--primary-dark); }
  </style>
</head>
<body>

  <header>
    <div class="header-wrap">
      <h2>Geoportal Civil</h2>
      <nav class="tabs">
        <button class="tab-btn active" data-target="p-inicio">Inicio</button>
        <button class="tab-btn" data-target="p-capas">Capas WMS</button>
        <button class="tab-btn" data-target="p-visor">Mapa Interactivo</button>
      </nav>
    </div>
  </header>

  <main>
    <section id="p-inicio" class="panel active">
      <h1>Bienvenida al Geoportal</h1>
      <p>Selecciona una pestaña para visualizar la información geográfica.</p>
    </section>

    <section id="p-capas" class="panel">
      <h3>Previsualización de Capas de GeoServer</h3>
      <div class="btn-group">
        <button class="btn layer-btn" data-layer="puntos">Puntos</button>
        <button class="btn layer-btn" data-layer="lineas">Líneas</button>
        <button class="btn btn-success layer-btn" data-layer="composicion">Composición Total</button>
      </div>
      <div class="wms-container">
        <img id="wmsPreview" src="" alt="Elige una capa para verla">
      </div>
    </section>

    <section id="p-visor" class="panel">
      <h3>Visor Interactivo (OpenStreetMap)</h3>
      <div id="map"></div>
      <div class="coords" id="coords">Lat: 0.00, Lon: 0.00</div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/ol@v10.8.0/dist/ol.js"></script>

  <script>
    // --- CONFIGURACIÓN ---
    const GEOSERVER_URL = "https://idesinde.com/geoserver/wms";
    const INITIAL_COORDS = [-78.50, -0.20]; // Quito

    // 1. Manejo de Pestañas
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        
        btn.classList.add('active');
        const target = document.getElementById(btn.dataset.target);
        target.classList.add('active');

        if(btn.dataset.target === 'p-visor') {
            setTimeout(() => map.updateSize(), 200);
        }
      });
    });

    // 2. Lógica WMS
    document.querySelectorAll('.layer-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const layer = btn.dataset.layer;
        const url = `${GEOSERVER_URL}?service=WMS&version=1.1.0&request=GetMap&layers=${layer}&width=800&height=500&srs=EPSG:4326&format=image/png`;
        document.getElementById('wmsPreview').src = url;
      });
    });

    // 3. Mapa Interactivo
    const map = new ol.Map({
      target: 'map',
      layers: [
        new ol.layer.Tile({ source: new ol.source.OSM() })
      ],
      view: new ol.View({
        center: ol.proj.fromLonLat(INITIAL_COORDS),
        zoom: 12
      })
    });

    // Coordenadas en tiempo real
    map.on('pointermove', (evt) => {
      const coord = ol.proj.toLonLat(evt.coordinate);
      document.getElementById('coords').innerHTML = `Lat: ${coord[1].toFixed(5)}, Lon: ${coord[0].toFixed(5)}`;
    });
  </script>
</body>
</html>
