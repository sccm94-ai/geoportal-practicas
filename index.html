<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Geoportal del Estudiante</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- OpenLayers v6 (estable con API clásica) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@6.15.1/ol.css" />
  <script src="https://cdn.jsdelivr.net/npm/ol@6.15.1/dist/ol.js"></script>

  <style>
    :root{
      --primary:#0f4c81;
      --primary-dark:#09304f;
      --accent:#1ea7fd;
      --bg:#f5f7fb;
      --card:#ffffff;
      --text:#1d2733;
      --muted:#5f6b7a;
      --border:#d9e2ec;
      --success:#157347;
      --shadow:0 10px 24px rgba(15,76,129,.12);
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:var(--bg);}
    header{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:18px;}
    nav{display:flex;gap:10px;justify-content:center;margin-top:10px;}
    nav button{padding:10px 14px;border:none;border-radius:8px;background:#fff;color:var(--primary-dark);font-weight:bold;cursor:pointer;}
    nav button:hover{background:#e6f0ff;}
    .section{display:none;max-width:1100px;margin:20px auto;background:#fff;padding:20px;border-radius:12px;box-shadow:var(--shadow);}
    .active{display:block;}
    #map{width:100%;height:520px;border-radius:12px;border:1px solid var(--border);}
    .btn{padding:10px 12px;border:none;border-radius:8px;background:var(--primary);color:#fff;cursor:pointer;margin:5px;}
    .btn:hover{background:var(--primary-dark);}
    .coord{margin-top:10px;font-family:monospace;color:var(--primary-dark);}
    form{display:flex;flex-direction:column;gap:10px;}
    input,textarea{padding:10px;border-radius:8px;border:1px solid #ccc;}
  </style>
</head>

<body>

<header>
  <h1>Geoportal del Estudiante</h1>
  <nav>
    <button onclick="showSection('cv')">Curriculum</button>
    <button onclick="showSection('visor')">Visor PRO</button>
    <button onclick="showSection('contacto')">Contacto</button>
  </nav>
</header>

<!-- CV -->
<div id="cv" class="section active">
  <h2>Curriculum Vitae</h2>
  <p><strong>Nombre:</strong> Sofía Carpio</p>
  <p><strong>Profesión:</strong> Ingeniera Civil</p>
  <p><strong>Correo:</strong> sccm94@gmail.com</p>
</div>

<!-- VISOR -->
<div id="visor" class="section">
  <h2>Visor Cartográfico Profesional</h2>

  <button class="btn" onclick="toggleLayer('lineas')">Tuberías</button>
  <button class="btn" onclick="toggleLayer('poligonos')">Sectores</button>
  <button class="btn" onclick="resetView()">Reset</button>

  <div id="map"></div>
  <div class="coord" id="coords">Lat: -, Lon: -</div>
</div>

<!-- CONTACTO -->
<div id="contacto" class="section">
  <h2>Contacto</h2>
  <form onsubmit="sendMail(event)">
    <input type="text" id="nombre" placeholder="Nombre" required>
    <input type="email" id="correo" placeholder="Correo" required>
    <input type="text" id="asunto" placeholder="Asunto" required>
    <textarea id="mensaje" placeholder="Mensaje" required></textarea>
    <button class="btn" type="submit">Enviar</button>
  </form>
</div>

<script>

// navegación
function showSection(id){
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  setTimeout(()=> map.updateSize(),200);
}

// mapa base
const osm = new ol.layer.Tile({
  source: new ol.source.OSM()
});

// WMS layers
const lineas = new ol.layer.Tile({
  source: new ol.source.TileWMS({
    url: 'https://geoserver.idesinde.com:8443/geoserver/Carpio/wms',
    params: {LAYERS:'Carpio:TuberiaDeAguaCHA3',TILED:true},
    serverType: 'geoserver'
  }),
  visible:false
});

const poligonos = new ol.layer.Tile({
  source: new ol.source.TileWMS({
    url: 'https://geoserver.idesinde.com:8443/geoserver/Carpio/wms',
    params: {LAYERS:'Carpio:Sector_Hidraulico',TILED:true},
    serverType: 'geoserver'
  }),
  visible:false
});

const map = new ol.Map({
  target: 'map',
  layers: [osm,lineas,poligonos],
  view: new ol.View({
    center: ol.proj.fromLonLat([-78.56,-0.29]),
    zoom: 14
  }),
  controls: ol.control.defaults().extend([
    new ol.control.ScaleLine()
  ])
});

// toggle layers
function toggleLayer(tipo){
  if(tipo==='lineas') lineas.setVisible(!lineas.getVisible());
  if(tipo==='poligonos') poligonos.setVisible(!poligonos.getVisible());
}

// reset
function resetView(){
  map.getView().setCenter(ol.proj.fromLonLat([-78.56,-0.29]));
  map.getView().setZoom(14);
}

// coords
map.on('pointermove', function(evt){
  const c = ol.proj.toLonLat(evt.coordinate);
  document.getElementById('coords').innerText =
    "Lat: "+c[1].toFixed(6)+" Lon: "+c[0].toFixed(6);
});

// mail
function sendMail(e){
  e.preventDefault();
  const nombre = document.getElementById('nombre').value;
  const correo = document.getElementById('correo').value;
  const asunto = document.getElementById('asunto').value;
  const mensaje = document.getElementById('mensaje').value;

  const body = `Nombre: ${nombre}%0AEmail: ${correo}%0A%0A${mensaje}`;
  window.location.href = `mailto:sccm94@gmail.com?subject=${encodeURIComponent(asunto)}&body=${body}`;
}

</script>

</body>
</html>

<div id="descargas" class="section">
  <h2>Descarga de capas</h2>

  <h3>Hidrantes</h3>
  <a class="btn" href="data/Hidrantes.zip" download>Shapefile</a>
  <a class="btn" href="data/hidCHA3.kmz" download>KMZ</a>

  <h3>Tuberías</h3>
  <a class="btn" href="data/TuberiaDeAguaCHA3_shp.zip" download>Shapefile</a>
  <a class="btn" href="data/TuberíadeAguaCHA3.kmz" download>KMZ</a>

  <h3>Sectores Hidráulicos</h3>
  <a class="btn" href="data/SectoresHidraulicos.zip" download>Shapefile</a>
  <a class="btn" href="data/SectoresHidraulicos.kml" download>KML</a>

</div>
